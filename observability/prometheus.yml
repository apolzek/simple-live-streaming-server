# Prometheus "puxa" (scrape) métricas de cada peça da pipeline a cada 5s.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ingest + LL-HLS + WebRTC: conexões, bytes recebidos/enviados, perdas (SRT/RTP)
  - job_name: mediamtx
    static_configs: [{ targets: ["mediamtx:9998"] }]

  # hub: transcoder (fps/speed), chat, espectadores e QoE vindo dos players
  - job_name: hub
    static_configs: [{ targets: ["hub:8000"] }]

  # edge/CDN: conexões e requisições do NGINX
  - job_name: edge
    static_configs: [{ targets: ["nginx-exporter:9113"] }]

  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
