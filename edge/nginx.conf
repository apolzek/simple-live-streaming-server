# =============================================================================
# Edge / "mini CDN" do StreamLab
# -----------------------------------------------------------------------------
# Dois servidores no mesmo NGINX para ensinar o conceito de CDN:
#
#   navegador ──► EDGE :8081 (cache) ──► ORIGIN :8082 (arquivos do transcoder)
#
# Abra o DevTools > Network e observe o header X-Cache: MISS na primeira vez
# que um segmento é pedido e HIT nas próximas. Com 1.000 espectadores, o
# origin recebe ~1 pedido por segmento; o resto sai do cache.
# =============================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/iso.segment             m4s;
        video/mp4                     mp4;
    }
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Log em JSON: inclui o cache status e o CMCD (Common Media Client Data,
    # CTA-5004) que o hls.js anexa em cada requisição. Veja com:
    #   docker compose logs -f edge
    log_format edge_json escape=json
      '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
      '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
      '"rt":$request_time,"cache":"$upstream_cache_status",'
      '"upstream_rt":"$upstream_response_time","cmcd":"$arg_CMCD","ua":"$http_user_agent"}';

    proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls:10m max_size=1g inactive=2m use_temp_path=off;

    # ------------------------------------------------------------- ORIGIN
    server {
        listen 8082;
        access_log off;
        root /srv;                      # volume compartilhado com o hub (/hls)

        location /hls/ {
            # playlists mudam a cada segmento: cache curtíssimo
            location ~ \.m3u8$ { add_header Cache-Control "max-age=1" always; }
            # segmentos e init são imutáveis: cache longo
            location ~ \.(m4s|mp4)$ { add_header Cache-Control "max-age=60" always; }
            location ~ \.jpg$  { add_header Cache-Control "max-age=4" always; }
        }
    }

    # --------------------------------------------------------------- EDGE
    server {
        listen 8081;
        access_log /dev/stdout edge_json;

        location /hls/ {
            # CORS: a UI (porta 8000) busca vídeo nesta origem (porta 8081)
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "X-Cache, Age" always;
            add_header X-Cache $upstream_cache_status always;
            if ($request_method = OPTIONS) { return 204; }

            proxy_pass http://127.0.0.1:8082;
            proxy_cache hls;
            # o CMCD muda por requisição: NÃO pode fazer parte da chave de cache
            proxy_cache_key $scheme$host$uri;
            proxy_cache_valid 200 302 1s;   # sobrescrito pelo Cache-Control do origin
            proxy_cache_valid 404 1s;       # evita martelar o origin pedindo segmento futuro
            # "request coalescing": 1.000 pedidos simultâneos do mesmo segmento
            # viram 1 pedido ao origin; os outros esperam o cache encher.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_use_stale updating error timeout;
        }

        location = /healthz { access_log off; return 200 "ok\n"; }
    }

    # ---------------------------------------------- métricas (nginx-exporter)
    server {
        listen 8085;
        access_log off;
        location = /stub_status { stub_status; }
    }
}
